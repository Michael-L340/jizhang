  <rect width="512" height="512" rx="118" fill="#f7f0e4"/>
  <!-- 账本 -->
  <rect x="126" y="112" width="260" height="288" rx="26" fill="#c98b4b"/>
  <rect x="126" y="112" width="46" height="288" rx="26" fill="#a86c33"/>
  <circle cx="149" cy="176" r="9" fill="#f2ddc0"/>
  <circle cx="149" cy="256" r="9" fill="#f2ddc0"/>
  <circle cx="149" cy="336" r="9" fill="#f2ddc0"/>
  <!-- 金额条 -->
  <rect x="206" y="164" width="140" height="20" rx="10" fill="#e0b078"/>
  <rect x="206" y="206" width="96" height="20" rx="10" fill="#d9a469"/>
